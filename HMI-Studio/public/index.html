<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HMI-Studio - 工业 HMI 开发工具</title>
<style>
:root {
  --bg: #1e1e1e; --bg2: #252526; --bg3: #2d2d30;
  --fg: #cccccc; --fg2: #969696; --fg3: #6e6e6e;
  --blue: #0099cc; --green: #4caf50; --red: #f44336; --yellow: #ff9800;
  --border: #3c3c3c;
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; overflow:hidden; font-family:"Segoe UI","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--fg); font-size:13px; }
::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

/* ---- Layout ---- */
.app { display:flex; flex-direction:column; height:100%; }

/* ---- Menu Bar ---- */
.menubar {
  height:30px; background:var(--bg3); display:flex; align-items:center;
  padding:0 8px; border-bottom:1px solid var(--border); flex-shrink:0;
  gap:4px;
}
.menubar .menu-item {
  padding:3px 10px; cursor:pointer; border-radius:3px; font-size:12px;
}
.menubar .menu-item:hover { background:var(--border); }
.menubar .menu-item:active { background:var(--blue); }
.menubar .title { color:var(--blue); font-weight:600; margin-right:16px; font-size:13px; }
.menubar .right { margin-left:auto; display:flex; gap:8px; align-items:center; }
.menubar .status-dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
.dot-off { background:var(--red); }
.dot-on { background:var(--green); }

/* ---- Tool Bar ---- */
.toolbar {
  height:36px; background:var(--bg2); display:flex; align-items:center;
  padding:0 8px; border-bottom:1px solid var(--border); gap:4px; flex-shrink:0;
}
.toolbar .btn {
  padding:4px 12px; border:none; background:var(--bg3); color:var(--fg);
  cursor:pointer; border-radius:3px; font-size:12px; white-space:nowrap;
}
.toolbar .btn:hover { background:var(--border); }
.toolbar .btn.blue { background:var(--blue); color:#fff; }
.toolbar .btn.green { background:var(--green); color:#fff; }
.toolbar .btn.red { background:var(--red); color:#fff; }
.toolbar .sep { width:1px; height:20px; background:var(--border); margin:0 4px; }

/* ---- Main Area ---- */
.main { display:flex; flex:1; overflow:hidden; }

/* ---- Left Panel (Project Explorer + Tag DB) ---- */
.left-panel {
  width:250px; min-width:200px; background:var(--bg2);
  border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0;
}
.left-panel .tabs {
  display:flex; border-bottom:1px solid var(--border);
}
.left-panel .tabs .tab {
  padding:6px 12px; cursor:pointer; font-size:12px; color:var(--fg2);
  border-bottom:2px solid transparent; flex:1; text-align:center;
}
.left-panel .tabs .tab.active { color:var(--blue); border-bottom-color:var(--blue); }
.left-panel .content { flex:1; overflow-y:auto; padding:8px; }
.left-panel .content .item { padding:4px 8px; cursor:pointer; border-radius:3px; font-size:12px; }
.left-panel .content .item:hover { background:var(--bg3); }
.left-panel .content .item .tag-addr { color:var(--fg2); font-size:11px; }
.left-panel .content .item .tag-val { color:var(--green); float:right; }
.tree-item { padding:3px 8px; cursor:pointer; border-radius:3px; display:flex; align-items:center; gap:4px; }
.tree-item:hover { background:var(--bg3); }
.tree-item .icon { color:var(--yellow); }
.tree-item.sub { padding-left:24px; }
.tree-item .del { margin-left:auto; color:var(--red); cursor:pointer; opacity:0; }
.tree-item:hover .del { opacity:1; }

/* ---- Center (Canvas) ---- */
.canvas-area { flex:1; display:flex; flex-direction:column; position:relative; overflow:hidden; }
.canvas-area .tabs {
  height:30px; background:var(--bg3); display:flex; align-items:center;
  padding:0 8px; border-bottom:1px solid var(--border); flex-shrink:0; gap:2px;
}
.canvas-area .tabs .s-tab { padding:4px 12px; cursor:pointer; font-size:12px; border-radius:3px 3px 0 0; }
.canvas-area .tabs .s-tab.active { background:var(--bg2); color:var(--blue); }
.canvas-area .canvas-wrap {
  flex:1; overflow:auto; display:flex; align-items:center; justify-content:center;
  background: #1a1a1a; position:relative;
}
.canvas {
  width:800px; height:480px; background:#2a2a2a;
  position:relative; box-shadow:0 0 20px rgba(0,0,0,0.5);
  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size:20px 20px;
}
.canvas .widget {
  position:absolute; cursor:move; border:1px solid transparent;
  display:flex; align-items:center; justify-content:center;
  font-size:14px; overflow:hidden;
}
.canvas .widget:hover { border-color:var(--blue); }
.canvas .widget.selected { border-color:var(--blue); outline:2px solid rgba(0,153,204,0.3); }
.canvas .widget .w-label { pointer-events:none; }
.w-btn { background:var(--blue); color:#fff; border-radius:4px; cursor:pointer; }
.w-lamp { border-radius:50%; }
.w-lamp.on { background:var(--green); box-shadow:0 0 10px var(--green); }
.w-lamp.off { background:var(--fg3); }
.w-meter { background:var(--bg3); }
.w-meter .fill { position:absolute; bottom:0; left:0; background:var(--green); height:60%; border-radius:0 0 4px 4px; }
.w-display { background:var(--bg); color:var(--green); font-family:monospace; font-size:24px; border:1px solid var(--border); }
.w-switch { background:var(--bg3); border:2px solid var(--fg3); border-radius:4px; cursor:pointer; }
.w-switch.on { border-color:var(--green); background:rgba(76,175,80,0.2); }
.w-switch.off { border-color:var(--red); }

/* ---- Right Panel (Properties) ---- */
.right-panel {
  width:280px; min-width:200px; background:var(--bg2);
  border-left:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0;
  overflow-y:auto; padding:8px;
}
.right-panel .section { margin-bottom:12px; }
.right-panel .section .sec-title {
  font-size:11px; color:var(--blue); text-transform:uppercase; margin-bottom:6px; font-weight:600;
}
.right-panel .prop-row { display:flex; align-items:center; margin-bottom:4px; gap:4px; }
.right-panel .prop-row label { min-width:70px; font-size:12px; color:var(--fg2); }
.right-panel .prop-row input,
.right-panel .prop-row select {
  flex:1; background:var(--bg); border:1px solid var(--border); color:var(--fg);
  padding:3px 6px; border-radius:3px; font-size:12px; outline:none;
}
.right-panel .prop-row input:focus { border-color:var(--blue); }

/* ---- Status Bar ---- */
.statusbar {
  height:24px; background:var(--blue); display:flex; align-items:center;
  padding:0 12px; font-size:11px; color:#fff; flex-shrink:0; justify-content:space-between;
}

/* ---- Dialogs ---- */
.modal-overlay {
  display:none; position:fixed; top:0; left:0; right:0; bottom:0;
  background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;
}
.modal-overlay.show { display:flex; }
.modal {
  background:var(--bg2); border:1px solid var(--border); border-radius:8px;
  padding:20px; min-width:400px; max-height:80vh; overflow-y:auto;
}
.modal h3 { margin-bottom:12px; color:var(--blue); font-size:14px; }
.modal .row { display:flex; gap:8px; margin-bottom:8px; align-items:center; }
.modal .row label { min-width:80px; font-size:12px; color:var(--fg2); }
.modal .row input, .modal .row select {
  flex:1; background:var(--bg); border:1px solid var(--border); color:var(--fg);
  padding:5px 8px; border-radius:3px; font-size:13px; outline:none;
}
.modal .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
.modal .actions button {
  padding:6px 16px; border:none; border-radius:4px; cursor:pointer; font-size:12px;
}
</style>
</head>
<body>
<div class="app">

  <!-- Menu Bar -->
  <div class="menubar">
    <span class="title">HMI-Studio</span>
    <span class="menu-item" onclick="showDialog('project')">项目</span>
    <span class="menu-item" onclick="showDialog('device')">设备</span>
    <span class="menu-item" onclick="showDialog('tag')">标签</span>
    <span class="menu-item" onclick="showDialog('screen')">画面</span>
    <span class="menu-item" onclick="showDialog('widget')">元件</span>
    <div class="right">
      <span id="statusLabel" style="font-size:12px">● 离线</span>
      <span class="status-dot dot-off" id="statusDot"></span>
    </div>
  </div>

  <!-- Tool Bar -->
  <div class="toolbar">
    <button class="btn blue" onclick="showDialog('device')">+ 添加设备</button>
    <button class="btn" onclick="showDialog('tag')">+ 添加标签</button>
    <button class="btn" onclick="showDialog('screen')">+ 添加画面</button>
    <span class="sep"></span>
    <button class="btn green" onclick="startMonitor()">▶ 在线监控</button>
    <button class="btn red" onclick="stopMonitor()">■ 停止</button>
    <span class="sep"></span>
    <button class="btn" onclick="simulateScreen()">▶ 仿真运行</button>
    <span class="sep"></span>
    <button class="btn" onclick="exportProject()">📦 导出</button>
    <button class="btn" onclick="document.getElementById('importFile').click()">📂 导入</button>
    <input type="file" id="importFile" style="display:none" accept=".json" onchange="importProject(event)">
  </div>

  <!-- Main -->
  <div class="main">

    <!-- Left Panel -->
    <div class="left-panel">
      <div class="tabs">
        <div class="tab active" onclick="switchLeftTab(this,'projectTree')">项目</div>
        <div class="tab" onclick="switchLeftTab(this,'tagList')">标签</div>
        <div class="tab" onclick="switchLeftTab(this,'deviceList')">设备</div>
      </div>
      <div class="content" id="projectTree">
        <div class="tree-item"><span class="icon">📁</span> 我的项目</div>
        <div class="tree-item sub"><span class="icon">🖥️</span> 画面 1</div>
        <div class="tree-item sub" style="color:var(--fg2)">右键添加新画面...</div>
      </div>
      <div class="content" id="tagList" style="display:none">
        <div style="color:var(--fg2);font-size:12px;margin-bottom:8px">暂无标签，点击工具栏添加</div>
        <div id="tagItems"></div>
      </div>
      <div class="content" id="deviceList" style="display:none">
        <div id="deviceItems"></div>
      </div>
    </div>

    <!-- Canvas Area -->
    <div class="canvas-area">
      <div class="tabs">
        <div class="s-tab active">画面 1</div>
      </div>
      <div class="canvas-wrap">
        <div class="canvas" id="canvas"></div>
      </div>
    </div>

    <!-- Right Panel -->
    <div class="right-panel" id="propPanel">
      <div style="color:var(--fg2);font-size:12px;padding:20px;text-align:center">
        选择画面上的元件<br>查看和编辑属性
      </div>
    </div>

  </div>

  <!-- Status Bar -->
  <div class="statusbar">
    <span>就绪 | 支持: Modbus TCP, Siemens S7, 更多协议扩展中</span>
    <span id="sbRight">画面: 800×480 | 元件: 0</span>
  </div>
</div>

<!-- ============ Dialogs ============ -->

<!-- Device Dialog -->
<div class="modal-overlay" id="dlgDevice">
<div class="modal">
  <div class="modal-header">添加设备</div>
  <div class="row"><label>设备名称</label><input id="dvName" value="PLC1"></div>
  <div class="row"><label>通讯协议</label>
    <select id="dvProtocol">
      <option value="modbus-tcp">Modbus TCP</option>
      <option value="siemens-s7">Siemens S7 (ISO-on-TCP)</option>
      <option value="modbus-rtu">Modbus RTU (串口网关)</option>
    </select>
  </div>
  <div class="row"><label>IP 地址</label><input id="dvIp" value="192.168.0.1"></div>
  <div class="row"><label>端口号</label><input id="dvPort" value="502"></div>
  <div class="row"><label>单元 ID / 机架</label><input id="dvUnit" value="1"></div>
  <div class="row"><label>描述</label><input id="dvDesc" value=""></div>
  <div class="actions">
    <button style="background:var(--bg3);color:var(--fg)" onclick="closeDialog('dlgDevice')">取消</button>
    <button style="background:var(--green);color:#fff" onclick="addDevice()">添加</button>
    <button style="background:var(--blue);color:#fff" onclick="testDevice()">测试连接</button>
  </div>
</div></div>

<!-- Tag Dialog -->
<div class="modal-overlay" id="dlgTag">
<div class="modal">
  <div class="modal-header">添加标签</div>
  <div class="row"><label>标签名称</label><input id="tgName" value="Tag1"></div>
  <div class="row"><label>所属设备</label><select id="tgDevice"></select></div>
  <div class="row"><label>数据类型</label>
    <select id="tgType">
      <option value="bool">Bool (位)</option>
      <option value="word">Word (16位)</option>
      <option value="dword">DWord (32位)</option>
      <option value="int">Int (16位有符号)</option>
      <option value="real">Real/Float (32位)</option>
    </select>
  </div>
  <div class="row"><label>地址</label><input id="tgAddr" value="D100" placeholder="如: M0, D100, 40001, DB1.DBW0"></div>
  <div class="row"><label>初始值</label><input id="tgInit" value="0"></div>
  <div class="row"><label>描述</label><input id="tgDesc" value=""></div>
  <div class="actions">
    <button style="background:var(--bg3);color:var(--fg)" onclick="closeDialog('dlgTag')">取消</button>
    <button style="background:var(--blue);color:#fff" onclick="addTag()">添加</button>
  </div>
</div></div>

<!-- Screen Dialog -->
<div class="modal-overlay" id="dlgScreen">
<div class="modal">
  <div class="modal-header">添加画面</div>
  <div class="row"><label>画面名称</label><input id="scName" value="画面 1"></div>
  <div class="row"><label>分辨率</label>
    <select id="scRes">
      <option value="800x480">800 × 480 (标准)</option>
      <option value="1024x600">1024 × 600 (宽屏)</option>
      <option value="480x272">480 × 272 (小型)</option>
      <option value="1280x800">1280 × 800 (平板)</option>
      <option value="1920x1080">1920 × 1080 (全高清)</option>
    </select>
  </div>
  <div class="row"><label>背景色</label><input id="scBg" value="#2a2a2a" placeholder="#2a2a2a"></div>
  <div class="actions">
    <button style="background:var(--bg3);color:var(--fg)" onclick="closeDialog('dlgScreen')">取消</button>
    <button style="background:var(--blue);color:#fff" onclick="addScreen()">添加</button>
  </div>
</div></div>

<!-- Widget Dialog -->
<div class="modal-overlay" id="dlgWidget">
<div class="modal">
  <div class="modal-header">添加元件</div>
  <div class="row"><label>元件类型</label>
    <select id="wgType">
      <option value="btn">按钮 (写入值)</option>
      <option value="lamp">指示灯 (显示位状态)</option>
      <option value="display">数值显示 (显示寄存器值)</option>
      <option value="meter">进度条 (显示百分比)</option>
      <option value="switch">开关 (切换位状态)</option>
      <option value="label">文本标签</option>
    </select>
  </div>
  <div class="row"><label>绑定标签</label><select id="wgTag"></select></div>
  <div class="row"><label>文字</label><input id="wgText" value="按钮"></div>
  <div class="actions">
    <button style="background:var(--bg3);color:var(--fg)" onclick="closeDialog('dlgWidget')">取消</button>
    <button style="background:var(--blue);color:#fff" onclick="addWidget()">添加</button>
  </div>
</div></div>

<script src="js/ide-core.js"></script>
</body>
</html>
